name: Deploy to swstevens.github.io

on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: './windows-95-svelte/package-lock.json'

      - name: Install dependencies
        run: npm install
        working-directory: ./windows-95-svelte

      - name: Build
        env:
          BASE_PATH: ''
        run: npm run build
        working-directory: ./windows-95-svelte

      - name: Ensure target repo serves Pages from the main branch
        run: |
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.PAGES_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/swstevens/swstevens.github.io/pages \
            -d '{"source":{"branch":"main","path":"/"}}'

      - name: Publish build output to swstevens.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: swstevens/swstevens.github.io
          publish_branch: main
          publish_dir: ./windows-95-svelte/build
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy windows-95-svelte @ ${{ github.sha }}'
